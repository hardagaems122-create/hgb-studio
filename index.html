:root{--bg:#0e0b1a;--panel:#171329;--line:#2c2548;--txt:#f1eefc;--mut:#a59fc4;--a:#ff5c39;--b:#7c5cff;--ok:#2ecc71;--no:#ff4d6d}
*{box-sizing:border-box;margin:0}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:9;background:rgba(14,11,26,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem}
.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--panel)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:6px 14px;border-radius:99px;color:var(--mut);font-size:.95rem}
nav a.on,nav a:hover{background:var(--b);color:#fff}
main{max-width:1100px;margin:auto;padding:28px 16px;width:100%;flex:1}
h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.25}
h2{font-size:1.7rem;margin-bottom:6px}
.sub{color:var(--mut);margin-bottom:22px}
.hero{display:grid;gap:20px;padding:34px 0 26px}
.hero p{color:var(--mut);max-width:560px;font-size:1.1rem}
.hero em{font-style:normal;color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card.link:hover{border-color:var(--b);transform:translateY(-3px);transition:.2s}
.ico{width:64px;height:64px}
.price{font-size:1.5rem;font-weight:800;color:var(--a)}
.btn{display:inline-block;text-align:center;background:var(--a);color:#fff;font-weight:700;padding:10px 20px;border-radius:12px;border:0;cursor:pointer;font-size:1rem;font-family:inherit}
.btn:hover{filter:brightness(1.1)}
.btn.alt{background:var(--b)}
.btn.dis{background:#3a3456;color:#8b84ab;cursor:not-allowed}
.tag{font-size:.85rem;padding:2px 10px;border-radius:99px;background:rgba(255,77,109,.15);color:var(--no);align-self:flex-start}
.gtitle{display:flex;align-items:center;gap:12px;margin:30px 0 14px}
.gtitle b{width:6px;height:30px;border-radius:4px;background:var(--b)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:16px;overflow:hidden}
td,th{padding:12px 14px;border-bottom:1px solid var(--line);text-align:right}
th{background:#1f1a38;color:var(--mut)}
.wrap{overflow-x:auto}
.contact{text-align:center;align-items:center;padding:34px 20px}
.num{font-size:clamp(1.8rem,7vw,2.8rem);font-weight:800;direction:ltr;color:var(--a);letter-spacing:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.back{display:inline-block;margin-bottom:16px;color:var(--mut)}
.stars{color:#ffc542}
footer{border-top:1px solid var(--line);background:#0a0814;padding:26px 16px;text-align:center}
footer .row a{padding:8px 16px;border:1px solid var(--line);border-radius:99px;color:var(--mut)}
footer .row a:hover{border-color:var(--b);color:#fff}
footer p{color:var(--mut);margin-top:14px;font-size:.9rem}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}

.fld{width:100%;background:#0e0b1a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.fld:focus{border-color:var(--b);outline:none}
textarea.fld{min-height:100px;resize:vertical}
.frm{display:grid;gap:12px;max-width:640px}
.empty{text-align:center;color:var(--mut);padding:30px}
.cm small{color:var(--mut)}

.hero{grid-template-columns:1fr auto;align-items:center}
.hero>div{display:grid;gap:20px}
.hero-logo{width:min(300px,70vw);border-radius:24px;border:1px solid var(--line)}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero-logo{order:-1;margin:auto}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--y:#ffd400;--yg:rgba(255,212,0,.55)}
header{border-bottom:1px solid var(--yg);box-shadow:0 2px 16px rgba(255,212,0,.18)}
footer{border-top:1px solid var(--yg);box-shadow:0 -2px 16px rgba(255,212,0,.12)}
.card,table,.fld,.hero-logo{border:1px solid var(--yg);box-shadow:0 0 10px rgba(255,212,0,.22),inset 0 0 12px rgba(255,212,0,.05)}
.card.link:hover,.fld:focus{border-color:var(--y);box-shadow:0 0 16px rgba(255,212,0,.5)}
nav a.on,nav a:hover{background:var(--y);color:#111}
footer .row a{border-color:var(--yg)}footer .row a:hover{border-color:var(--y);background:transparent}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:760px;margin:10px auto 0}
.tile{aspect-ratio:1/1;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--yg);border-radius:20px;padding:12px 12px 14px;text-align:center;overflow:hidden;box-shadow:0 0 12px rgba(255,212,0,.25),inset 0 0 14px rgba(255,212,0,.06);transition:.2s}
.tile:hover{transform:translateY(-4px);border-color:var(--y);box-shadow:0 0 22px rgba(255,212,0,.6),inset 0 0 18px rgba(255,212,0,.1)}
.tile .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:14px;margin-bottom:10px;background:radial-gradient(circle at 50% 55%,rgba(255,212,0,.16),transparent 70%),#0b0816;border:1px solid rgba(255,212,0,.25)}
.tile .neon{width:80%;height:80%;filter:drop-shadow(0 0 3px #ffd400) drop-shadow(0 0 9px rgba(255,212,0,.75))}
.tile h2{font-size:clamp(1rem,3.6vw,1.45rem);margin:0}
.tile .sub{margin:2px 0 0;font-size:.85rem}
@media(max-width:480px){.tiles{gap:12px}.tile{padding:8px 8px 10px;border-radius:16px}.tile .sub{display:none}}
.dimg{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:top;border-radius:12px;border:1px solid rgba(255,212,0,.35);cursor:zoom-in;background:#0b0816}
.lb{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 0 30px rgba(255,212,0,.5)}
.glogo{height:52px;width:auto;max-width:150px;object-fit:contain;border-radius:10px;box-shadow:0 0 10px rgba(255,212,0,.35)}
